# CI: node 20/22 矩阵 — 类型检查 + lint + 双冒烟(全部零真实 API; mock 显式注入)
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run smoke
      - run: npm run smoke:web
