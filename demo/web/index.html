<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-harness</title>
<style>
  :root {
    --bg: #0f1117; --bg2: #161923; --bg3: #1d2130;
    --border: #2a2f42; --text: #d7dae6; --dim: #7c8299;
    --accent: #d97757; --accent2: #8b5cf6;
    --ok: #3fb950; --err: #f85149; --warn: #d29922;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* ── 侧栏 ── */
  #sidebar {
    width: 230px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 12px;
  }
  #logo { font-family: var(--mono); font-weight: 700; font-size: 15px; padding: 4px 6px 14px; color: var(--accent); }
  #logo small { color: var(--dim); font-weight: 400; font-size: 11px; display: block; }
  #new-session {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px;
    font-size: 13px; cursor: pointer; margin-bottom: 12px;
  }
  #new-session:hover { filter: brightness(1.1); }
  #sessions { flex: 1; overflow-y: auto; }
  #sessions h3 { font-size: 11px; color: var(--dim); text-transform: uppercase; padding: 6px; letter-spacing: .05em; }
  .sess {
    padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 12px;
    font-family: var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sess:hover { background: var(--bg3); color: var(--text); }
  .sess.active { background: var(--bg3); color: var(--accent); }
  /* ── 主区 ── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    border-bottom: 1px solid var(--border); background: var(--bg2); font-size: 12px; color: var(--dim);
  }
  .badge {
    font-family: var(--mono); background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 2px 10px; font-size: 11px;
  }
  .badge b { color: var(--text); font-weight: 600; }
  .badge select {
    background: none; color: var(--text); border: 0; font: inherit; font-size: 11px;
    outline: 0; cursor: pointer; padding: 0;
  }
  .badge select option { background: var(--bg2); }
  #conn { margin-left: auto; }
  #conn.on { color: var(--ok); } #conn.off { color: var(--err); }
  /* 用量仪表盘: 水位条(usage 事件驱动, 分区着色) + 5h 窗口徽章(30s 轮询 /api/usage) */
  #ctx-wrap { display: inline-flex; align-items: center; gap: 5px; }
  #ctx-bar { width: 56px; height: 6px; border-radius: 3px; background: var(--bg3); border: 1px solid var(--border); overflow: hidden; }
  #ctx-fill { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  #ctx-wrap.warn #ctx-fill { background: var(--warn); }
  #ctx-wrap.danger #ctx-fill { background: var(--err); }
  #u5h-badge { cursor: pointer; }
  #u5h-badge:hover { border-color: var(--accent); color: var(--text); }
  /* 任务清单面板(TodoWrite todos 事件驱动; 空清单隐藏) */
  #todos {
    max-width: 860px; width: calc(100% - 36px); margin: 10px auto 0;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-family: var(--mono); font-size: 12px;
  }
  #todos[hidden] { display: none; }
  #todos h4 { margin: 2px 0 6px; font-size: 10px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
  #todos .todo { display: flex; gap: 8px; padding: 2px 0; color: var(--dim); }
  #todos .todo .tk { width: 16px; text-align: center; flex-shrink: 0; }
  #todos .todo.inp { color: var(--text); }
  #todos .todo.inp .tk { color: var(--accent); }
  #todos .todo.done span:last-child { text-decoration: line-through; opacity: .6; }
  #stream { flex: 1; overflow-y: auto; padding: 20px 18px 8px; scroll-behavior: smooth; }
  #stream-inner { max-width: 860px; margin: 0 auto; }
  /* 消息 */
  .msg { margin-bottom: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 12px 12px 3px 12px;
    padding: 9px 13px; margin-left: 60px; color: #e8eaf2;
  }
  .msg.assistant { padding: 2px 4px; }
  .msg.assistant::before { content: "✳"; color: var(--accent); font-size: 12px; margin-right: 8px; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* 工具卡片 */
  .tool {
    border: 1px solid var(--border); border-radius: 10px; margin: 8px 0 14px; overflow: hidden;
    background: var(--bg2); font-family: var(--mono); font-size: 12px;
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px; padding: 7px 11px; cursor: pointer; user-select: none;
  }
  .tool-head:hover { background: var(--bg3); }
  .tool-name { color: var(--accent2); font-weight: 600; }
  .tool-sum { color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-badge { font-size: 10px; border-radius: 10px; padding: 1px 8px; border: 1px solid var(--border); color: var(--dim); }
  .tool-badge.run { color: var(--warn); border-color: var(--warn); }
  .tool-badge.ok { color: var(--ok); border-color: var(--ok); }
  .tool-badge.err { color: var(--err); border-color: var(--err); }
  .tool-perm { font-size: 10px; color: var(--dim); }
  .tool-body { display: none; border-top: 1px solid var(--border); }
  .tool.open .tool-body { display: block; }
  .tool-body .lbl { color: var(--dim); padding: 6px 11px 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .tool-body pre {
    padding: 2px 11px 9px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: var(--text);
  }
  .tool-body pre.out { color: #a8b0c5; max-height: 300px; overflow-y: auto; }
  /* 系统行(压缩/日志/错误) */
  .sysline { font-family: var(--mono); font-size: 11px; color: var(--dim); margin: 3px 0; }
  .sysline.compact { color: var(--warn); }
  .sysline.error { color: var(--err); }
  .sysline.aborted { color: var(--warn); }
  .sysline.cmd { color: var(--accent2); }
  .sysline.log { display: none; }
  body.show-log .sysline.log { display: block; }
  /* 权限弹窗 */
  #perm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  #perm-overlay.show { display: flex; }
  #perm-card {
    width: min(520px, 92vw); background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  #perm-card h2 { font-size: 15px; margin-bottom: 10px; color: var(--warn); }
  #perm-tool { font-family: var(--mono); color: var(--accent2); margin-bottom: 6px; }
  #perm-why { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  #perm-input {
    font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; max-height: 180px; overflow: auto; margin-bottom: 16px;
    white-space: pre-wrap; word-break: break-word;
  }
  /* 权限弹窗 diff 预览(Edit/Write 时代替 JSON 入参) */
  #perm-diff {
    font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; max-height: 260px; overflow: auto; margin-bottom: 16px;
    white-space: pre; word-break: break-word;
  }
  #perm-diff .dv-path { color: var(--accent2); margin-bottom: 6px; }
  #perm-diff .dl { color: var(--err); }
  #perm-diff .da { color: var(--ok); }
  #perm-diff .dc { color: var(--dim); }
  #perm-diff .dv-note { color: var(--warn); margin-top: 6px; }
  #perm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  #perm-actions button { padding: 8px 18px; border-radius: 8px; border: 0; cursor: pointer; font-size: 13px; }
  #perm-yes { background: var(--ok); color: #fff; }
  #perm-always { background: var(--bg3); color: var(--ok); border: 1px solid var(--ok) !important; }
  #perm-no { background: var(--bg3); color: var(--text); border: 1px solid var(--border) !important; }
  /* 输入区 */
  #inputbar { padding: 12px 18px 16px; background: var(--bg); }
  #inputwrap {
    max-width: 860px; margin: 0 auto; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 14px; display: flex; align-items: flex-end; gap: 10px;
  }
  #inputwrap:focus-within { border-color: var(--accent); }
  #input {
    flex: 1; background: none; border: 0; outline: 0; resize: none; color: var(--text);
    font: inherit; max-height: 180px; line-height: 1.5;
  }
  #send {
    background: var(--accent); border: 0; color: #fff; border-radius: 9px;
    width: 34px; height: 34px; cursor: pointer; font-size: 15px; flex-shrink: 0;
  }
  #send:disabled { opacity: .4; cursor: default; }
  #stop {
    background: var(--err); border: 0; color: #fff; border-radius: 9px;
    width: 34px; height: 34px; cursor: pointer; font-size: 12px; flex-shrink: 0; display: none;
  }
  #stop:hover { filter: brightness(1.15); }
  #inputbar label {
    display: flex; align-items: center; gap: 5px; max-width: 860px; margin: 6px auto 0;
    font-size: 11px; color: var(--dim); font-family: var(--mono); cursor: pointer; user-select: none;
  }
</style>
</head>
<body>
  <nav id="sidebar">
    <div id="logo">agent-harness<small>harness web</small></div>
    <button id="new-session">＋ 新会话</button>
    <div id="sessions"><h3>会话</h3><div id="sess-list"></div></div>
  </nav>
  <main id="main">
    <div id="topbar">
      <span class="badge">model <b id="m-model">–</b></span>
      <span class="badge">perm <select id="m-mode" title="切换权限模式(双通道即时;bypassPermissions 须 /mode bypassPermissions --dangerous)"><option value="default">default</option><option value="auto">auto</option><option value="plan">plan</option></select></span>
      <span class="badge">session <b id="m-sess">–</b></span>
      <span class="badge" id="ctx-wrap" title="上下文水位(每轮快照)">ctx <span id="ctx-bar"><i id="ctx-fill"></i></span> <b id="ctx-pct">–</b></span>
      <span class="badge" id="u5h-badge" title="最近 5h 用量(点击查看明细)">5h <b id="u5h">–</b></span>
      <span id="conn" class="off">● connecting</span>
    </div>
    <div id="todos" hidden></div>
    <div id="stream"><div id="stream-inner"></div></div>
    <div id="inputbar">
      <div id="inputwrap">
        <textarea id="input" rows="1" placeholder="发送消息… (/ 命令如 /help /mode; Enter 发送 / Shift+Enter 换行)"></textarea>
        <button id="send" title="发送">➤</button>
        <button id="stop" title="中断当前任务">⏹</button>
      </div>
      <label><input type="checkbox" id="show-log"> 显示引擎日志(水位/cache/usage)</label>
    </div>
  </main>

  <div id="perm-overlay">
    <div id="perm-card">
      <h2>⚠ 权限确认</h2>
      <div id="perm-tool"></div>
      <div id="perm-why"></div>
      <div id="perm-diff"></div>
      <div id="perm-input"></div>
      <div id="perm-actions">
        <button id="perm-no">拒绝 (Esc)</button>
        <button id="perm-always"></button>
        <button id="perm-yes">允许执行</button>
      </div>
    </div>
  </div>

<script>
"use strict";
// ── 鉴权 token: 首次从 URL ?token= 取得, 存 sessionStorage(同标签页刷新免重带) ──
const urlParams = new URLSearchParams(location.search);
const TOKEN = urlParams.get("token") ?? sessionStorage.getItem("ah-token") ?? "";
if (TOKEN) sessionStorage.setItem("ah-token", TOKEN);
if (!TOKEN) {
  document.body.innerHTML =
    '<div style="margin:auto;font:14px/1.8 -apple-system,sans-serif;color:#d7dae6;text-align:center">' +
    "401 未授权 — 请使用服务启动时打印的带 <code>?token=</code> 的 URL 打开本页面</div>";
  throw new Error("missing token");
}
// 所有 API 调用统一带 x-auth-token header
function api(url, opts = {}) {
  return fetch(url, { ...opts, headers: { ...(opts.headers ?? {}), "x-auth-token": TOKEN } });
}

// ── DOM 基础 ──
const $ = (id) => document.getElementById(id);
const streamInner = $("stream-inner"), streamEl = $("stream");
const toolCards = new Map();       // toolUseId → card 元素
let streamBubble = null;           // 当前流式助手气泡(stop/新消息时关闭)
let activeSess = "";

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function nearBottom() {
  return streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 120;
}
function scrollBottom(force) {
  if (force || nearBottom()) streamEl.scrollTop = streamEl.scrollHeight;
}

// ── 渲染: 消息 ──
function addUser(text) {
  closeStream();
  streamInner.appendChild(el("div", "msg user", text));
  scrollBottom();
}
function ensureStream() {
  if (!streamBubble) {
    streamBubble = el("div", "msg assistant");
    streamBubble.appendChild(el("span", "cursor"));
    streamInner.appendChild(streamBubble);
  }
  return streamBubble;
}
function closeStream() {
  if (streamBubble) {
    streamBubble.querySelector(".cursor")?.remove();
    streamBubble = null;
  }
}
function assistantDelta(text) {
  const b = ensureStream();
  b.insertBefore(document.createTextNode(text), b.querySelector(".cursor"));
  scrollBottom();
}
function assistantMessage(text) {
  if (streamBubble) { closeStream(); } // 流式已渐进渲染 → 忽略整段重复
  else {
    const b = el("div", "msg assistant", text);
    streamInner.appendChild(b);
  }
  scrollBottom();
}

// ── 渲染: 工具卡片 ──
function inputSummary(name, input) {
  if (name === "Bash" && input.command) return String(input.command);
  for (const k of ["path", "file_path", "pattern", "query", "prompt"]) {
    if (input[k]) return `${k}: ${input[k]}`;
  }
  return JSON.stringify(input).slice(0, 120);
}
function toolStart(ev) {
  closeStream();
  const card = el("div", "tool");
  const head = el("div", "tool-head");
  head.appendChild(el("span", "tool-name", "⚙ " + ev.name));
  head.appendChild(el("span", "tool-sum", inputSummary(ev.name, ev.input)));
  const badge = el("span", "tool-badge run", "running");
  head.appendChild(badge);
  card.appendChild(head);
  const body = el("div", "tool-body");
  body.appendChild(el("div", "lbl", "input"));
  body.appendChild(el("pre", "in", JSON.stringify(ev.input, null, 2)));
  const outLbl = el("div", "lbl", "output"); const outPre = el("pre", "out", "");
  body.appendChild(outLbl); body.appendChild(outPre);
  card.appendChild(body);
  head.onclick = () => card.classList.toggle("open");
  streamInner.appendChild(card);
  toolCards.set(ev.id, { card, badge, outPre, perm: null });
  scrollBottom();
}
function toolResult(ev) {
  const t = toolCards.get(ev.id);
  if (!t) return;
  t.outPre.textContent = ev.output || "(空)";
  t.badge.textContent = ev.isError ? "error" : "done";
  t.badge.className = "tool-badge " + (ev.isError ? "err" : "ok");
  if (ev.isError) t.card.classList.add("open"); // 出错自动展开
  scrollBottom();
}
function permDecision(ev) {
  const t = toolCards.get(ev.id);
  if (!t) return;
  if (t.perm) t.perm.remove();
  t.perm = el("span", "tool-perm", `${ev.decision}·${ev.source}`);
  t.card.querySelector(".tool-head").appendChild(t.perm);
}

// ── 渲染: 系统行 ──
function sysLine(cls, text) {
  streamInner.appendChild(el("div", "sysline " + cls, text));
  scrollBottom();
}

// ── 渲染: 任务清单面板(TodoWrite 全量替换快照; 空清单隐藏; in_progress 优先展示 activeForm) ──
const TODO_ICON = { pending: "☐", in_progress: "◐", completed: "☑" };
function renderTodos(todos) {
  const panel = $("todos");
  if (!Array.isArray(todos) || todos.length === 0) { panel.hidden = true; return; }
  panel.textContent = "";
  panel.appendChild(el("h4", "", "todos"));
  for (const t of todos) {
    const row = el("div", "todo" + (t.status === "in_progress" ? " inp" : t.status === "completed" ? " done" : ""));
    row.appendChild(el("span", "tk", TODO_ICON[t.status] ?? "☐"));
    row.appendChild(el("span", "", t.status === "in_progress" && t.activeForm ? t.activeForm : t.content));
    panel.appendChild(row);
  }
  panel.hidden = false;
}

// ── 权限模式徽章(下拉切换)与 slash 命令渲染 ──
// setModeBadge: 同步下拉选中值; 命令切出的模式(如 bypassPermissions)不在静态选项中 → 动态补项仅用于显示
function setModeBadge(mode) {
  const sel = $("m-mode");
  if (![...sel.options].some((o) => o.value === mode)) {
    const o = document.createElement("option");
    o.value = mode; o.textContent = mode;
    sel.appendChild(o);
  }
  sel.value = mode;
}
// 下拉切换 → POST /api/mode(bypassPermissions 不在 UI 暴露); 成功后 mode_changed 事件回驱徽章(多标签页一致)
$("m-mode").onchange = async () => {
  const mode = $("m-mode").value;
  try {
    const r = await api("/api/mode", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode, sessionId: activeSess }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      sysLine("error", `✖ 模式切换失败: ${d.error || r.status}`);
    }
  } catch (e) { sysLine("error", `✖ 模式切换失败: ${e.message}`); }
};

// ── 用量仪表盘: 水位条(usage 事件, 轮入口快照) + 5h 窗口徽章(GET /api/usage) ──
function fmtK(n) {
  return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
}
// 水位条: buffer/effectiveWindow 百分比; 分区 <autoCompactAt 正常 / ≥autoCompactAt warn / ≥blockingAt danger
function setUsage(ev) {
  const pct = Math.min(100, Math.round((ev.bufferTokens / ev.watermarks.effectiveWindow) * 100));
  const wrap = $("ctx-wrap");
  $("ctx-fill").style.width = pct + "%";
  wrap.classList.toggle("warn", ev.bufferTokens >= ev.watermarks.autoCompactAt && ev.bufferTokens < ev.watermarks.blockingAt);
  wrap.classList.toggle("danger", ev.bufferTokens >= ev.watermarks.blockingAt);
  $("ctx-pct").textContent = pct + "%";
  wrap.title =
    `turn ${ev.turn} | buffer ${ev.bufferTokens} / effectiveWindow ${ev.watermarks.effectiveWindow} tokens\n` +
    `(warning ${ev.watermarks.warningAt} / autocompact ${ev.watermarks.autoCompactAt} / blocking ${ev.watermarks.blockingAt})\n` +
    `会话累计计费 ${ev.totalTokensUsed}${ev.tokenBudget ? "/" + ev.tokenBudget : ""} tokens`;
}
let u5hSummary = "";
async function refreshUsage() {
  try {
    const r = await api("/api/usage");
    if (!r.ok) return;
    const d = await r.json();
    $("u5h").textContent = fmtK(d.totals.total);
    u5hSummary =
      `[usage] 最近 5h: ${d.calls} 次调用 | 总计 ${d.totals.total} tokens` +
      `(in ${d.totals.input} / out ${d.totals.output} / cache_read ${d.totals.cacheRead} / cache_create ${d.totals.cacheCreate}) | 涉及 ${d.sessions} 个会话`;
  } catch { /* 服务未就绪时静默 */ }
}
$("u5h-badge").onclick = () => sysLine("cmd", u5hSummary || "[usage] 用量数据尚未就绪");
setInterval(refreshUsage, 30000);

// ── 权限弹窗(队列: 同刻可能有多个挂起请求, 逐个展示) ──
const permQueue = [];
let permShowing = null;
function showPerm(req) {
  permQueue.push(req);
  if (!permShowing) nextPerm();
}
function nextPerm() {
  permShowing = permQueue.shift() ?? null;
  if (!permShowing) { $("perm-overlay").classList.remove("show"); return; }
  $("perm-tool").textContent = `工具: ${permShowing.toolName}`;
  $("perm-why").textContent = `原因: ${permShowing.reason}`;
  // Edit/Write: 渲染 diff 预览(人类可读); 无预览回落 JSON 入参
  const diff = $("perm-diff"), inputEl = $("perm-input");
  diff.textContent = ""; diff.style.display = "none"; inputEl.style.display = "block";
  if (permShowing.preview) {
    diff.style.display = "block"; inputEl.style.display = "none";
    diff.appendChild(el("div", "dv-path",
      permShowing.preview.path + (permShowing.preview.type === "write-new" ? "(新文件)" : "")));
    for (const l of permShowing.preview.lines) {
      diff.appendChild(el("div",
        l.op === "del" ? "dl" : l.op === "add" ? "da" : "dc",
        (l.op === "del" ? "- " : l.op === "add" ? "+ " : "  ") + l.text));
    }
    if (permShowing.preview.note) diff.appendChild(el("div", "dv-note", "… " + permShowing.preview.note));
  } else {
    inputEl.textContent = JSON.stringify(permShowing.input, null, 2);
  }
  // "总是允许"按钮: 服务端注明 alwaysRule 时才提供(静态/Hook ask 路径不提供)
  const alwaysBtn = $("perm-always");
  if (permShowing.alwaysRule) {
    alwaysBtn.style.display = "";
    alwaysBtn.textContent = `总是允许 ${permShowing.alwaysRule}(本会话)`;
  } else {
    alwaysBtn.style.display = "none";
  }
  $("perm-overlay").classList.add("show");
}
async function answerPerm(answer) {
  const cur = permShowing;
  if (!cur) return;
  nextPerm();
  try {
    await api(`/api/permission/${encodeURIComponent(cur.id)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer }),
    });
  } catch { /* 连接断开: 事件流重连后状态自愈 */ }
}
$("perm-yes").onclick = () => answerPerm("yes");
$("perm-no").onclick = () => answerPerm("no");
$("perm-always").onclick = () => answerPerm("always");
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && permShowing) answerPerm("no");
});

// ── 会话列表 ──
async function refreshSessions() {
  try {
    const r = await api("/api/sessions");
    const d = await r.json();
    const list = $("sess-list");
    list.textContent = "";
    for (const s of d.sessions.slice(0, 30)) {
      const n = el("div", "sess" + (s.id === activeSess ? " active" : ""),
        s.id.replace(/^sess_/, "") + " · " + new Date(s.mtime).toLocaleString());
      n.onclick = async () => {
        if (s.id === activeSess) return;
        try {
          const r = await api("/api/session/resume", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: s.id }),
          });
          const d = await r.json();
          if (d.sessionId) await activateSession(d.sessionId);
        } catch (e) { sysLine("error", `✖ 切换会话失败: ${e.message}`); }
      };
      list.appendChild(n);
    }
  } catch { /* 服务未就绪时静默 */ }
}
// 会话切换(多会话并发): 从 POST 响应立即锁定视图, 再显式拉取该会话回放
// (确定性时序, 不依赖 SSE 广播与 fetch 的到达顺序); 附挂起弹窗与 running 态恢复
async function activateSession(id) {
  activeSess = id;
  streamInner.textContent = "";
  toolCards.clear();
  closeStream();
  setRunning(false);
  $("m-sess").textContent = id.replace(/^sess_/, "");
  // 水位条重置: 新视图尚未收到 usage 事件(轮入口才推送)
  $("ctx-pct").textContent = "–";
  $("ctx-fill").style.width = "0%";
  $("ctx-wrap").classList.remove("warn", "danger");
  try {
    const r = await api(`/api/session/history?sessionId=${encodeURIComponent(id)}`);
    if (!r.ok) { sysLine("error", "✖ 会话历史加载失败"); return; }
    const d = await r.json();
    $("m-model").textContent = d.model;
    setModeBadge(d.mode); // 实时模式(运行中 /mode 切换后切换视图正确回显)
    d.events.forEach(handleEvent); // 回放该会话消息树
    (d.pendingPerms ?? []).forEach(showPerm); // 该会话挂起的权限弹窗补放
    setRunning(!!d.running); // 切到运行中的会话 → 停止按钮正确恢复
    scrollBottom(true);
    refreshSessions();
  } catch (e) { sysLine("error", `✖ ${e.message}`); }
}
$("new-session").onclick = async () => {
  try {
    const r = await api("/api/session/new", { method: "POST" });
    const d = await r.json();
    if (d.sessionId) await activateSession(d.sessionId);
  } catch (e) { sysLine("error", `✖ 新建会话失败: ${e.message}`); }
};

// ── 事件分发(多会话: 事件带 sessionId 标记, 只处理当前视图的会话) ──
function relevant(ev) {
  if (ev.sessionId === undefined) return true; // 未标记(回放内嵌事件) → 放行
  if (!activeSess) return true;                // 初始连接(尚无视图) → 接受首个 ready
  return ev.sessionId === activeSess;          // 其他会话的事件 → 过滤(多标签页各看各的)
}
function handleEvent(ev) {
  if (!relevant(ev)) return;
  switch (ev.kind) {
    case "ready":
      $("m-model").textContent = ev.model;
      setModeBadge(ev.mode);
      $("m-sess").textContent = ev.sessionId.replace(/^sess_/, "");
      activeSess = ev.sessionId;
      refreshSessions();
      break;
    case "history":
      streamInner.textContent = "";
      toolCards.clear();
      closeStream();
      ev.events.forEach(handleEvent); // 复用同一套词汇重放
      scrollBottom(true);
      break;
    case "user_message": addUser(ev.text); break;
    case "assistant_delta": assistantDelta(ev.text); break;
    case "assistant_message": assistantMessage(ev.text); break;
    case "tool_start": toolStart(ev); break;
    case "tool_result": toolResult(ev); break;
    case "perm": permDecision(ev); break;
    case "command_output": sysLine("cmd", ev.text); break;   // slash 命令输出(/help /mode /status …)
    case "mode_changed": setModeBadge(ev.mode); break;      // 运行中模式切换 → 徽章同步(多标签页一致)
    case "usage": setUsage(ev); break;                      // 轮入口水位快照 → 水位条
    case "compact": sysLine("compact", `⇣ [${ev.level}] ${ev.detail}`); break;
    case "todos": renderTodos(ev.todos); break;                  // TodoWrite 全量替换快照 → 清单面板
    case "log": sysLine("log", ev.text); break;
    case "error": sysLine("error", `✖ ${ev.text}`); setRunning(false); break;
    case "aborted": sysLine("aborted", "⏹ 已中断(可继续发送下一条消息)"); closeStream(); setRunning(false); break;
    case "stop": closeStream(); refreshSessions(); refreshUsage(); setRunning(false); break;
    case "permission_request": showPerm(ev); break;
    case "permission_resolved":
      if (permShowing && permShowing.id === ev.id) nextPerm();
      break;
  }
}

// ── SSE 连接(token 经 query — EventSource 不能设 header) ──
function connect() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}`);
  es.onopen = () => { $("conn").textContent = "● connected"; $("conn").className = "on"; refreshUsage(); };
  es.onerror = () => { $("conn").textContent = "● reconnecting"; $("conn").className = "off"; };
  es.onmessage = (m) => {
    try { handleEvent(JSON.parse(m.data)); } catch { /* 忽略坏帧 */ }
  };
}
connect();

// ── 输入区 ──
const input = $("input"), sendBtn = $("send"), stopBtn = $("stop");
// 运行态: 发送后置真, stop/aborted/error 复位; 运行中发送钮变停止钮
function setRunning(v) {
  sendBtn.style.display = v ? "none" : "";
  stopBtn.style.display = v ? "" : "none";
}
stopBtn.onclick = async () => {
  try {
    const r = await api("/api/abort", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: activeSess }), // 只中断当前视图的会话
    });
    if (!r.ok) { const d = await r.json(); sysLine("error", `✖ ${d.error || r.status}`); }
  } catch (e) { sysLine("error", `✖ 中断请求失败: ${e.message}`); }
};
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; autosize();
  try {
    const r = await api("/api/message", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, sessionId: activeSess || undefined }), // 空视图 → 服务端用最近活动会话
    });
    if (!r.ok) { const d = await r.json(); sysLine("error", `✖ ${d.error || r.status}`); }
    else setRunning(true);
  } catch (e) { sysLine("error", `✖ 发送失败: ${e.message}`); }
}
sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", autosize);
$("show-log").onchange = (e) => document.body.classList.toggle("show-log", e.target.checked);
</script>
</body>
